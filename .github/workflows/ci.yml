name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Run 16-case deterministic Browser Agent evaluation
        run: npm run eval:baseline
      - name: Upload Browser Agent evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-agent-eval
          path: test-results/eval/
          if-no-files-found: ignore
      - name: Upload failed browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-evidence
          path: test-results/
          if-no-files-found: ignore
